<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gatito Enojado</title>
    <style>
        /* Estilos generales para ajustar el juego a pantalla completa en el celu */
        html, body {
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: none;
        }
        #hud {
            margin-top: 5px;
            font-size: 18px;
            font-weight: bold;
        }
        /* Forzamos al canvas a escalar y ocupar todo el ancho disponible */
        canvas {
            width: 100%;
            max-width: 450px; /* Para que no se deforme de más en pantallas gigantes */
            height: auto;
            border: 2px solid #333;
            background-color: #000;
        }
        /* Controles táctiles fijos y bien visibles abajo */
        #touch-controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            padding: 10px 0 20px 0;
            background: rgba(20, 20, 20, 0.9);
            box-sizing: border-box;
        }
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 6px;
        }
        .t-btn {
            background: #222;
            color: #fff;
            border: 2px solid #666;
            font-size: 24px;
            font-weight: bold;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        .t-btn:active {
            background: #444;
        }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }
        
        .action-pad {
            display: flex;
            align-items: center;
        }
        .action-btn {
            width: 80px;
            height: 80px;
            background: #8b0000;
            border-radius: 50%;
            border: 3px solid #ff4500;
            color: white;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            user-select: none;
        }
        .action-btn:active {
            background: #ff4500;
        }
    </style>
</head>
<body>

    <!-- HUD superior para mostrar las vidas restantes -->
    <div id="hud">VIDAS: 3</div>
    
    <!-- Canvas principal donde se renderiza el motor del juego -->
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <!-- Botones táctiles en pantalla para dispositivos móviles -->
    <div id="touch-controls">
        <div class="dpad">
            <div class="t-btn" id="btn-up">▲</div>
            <div class="t-btn" id="btn-left">◀</div>
            <div class="t-btn" id="btn-right">▶</div>
            <div class="t-btn" id="btn-down">▼</div>
        </div>
        <div class="action-pad">
            <div class="action-btn" id="btn-bomb">TRAMPA</div>
        </div>
    </div>

    <!-- Importación del script principal como módulo de ES6 -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
