<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gatito Enojado</title>
    <style>
        html, body {
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: none;
            position: fixed;
        }
        #hud {
            margin-top: 4px;
            font-size: 16px;
            font-weight: bold;
        }
        canvas {
            width: 100vw;
            max-width: 100%;
            height: auto;
            flex-grow: 1;
            object-fit: contain;
            background-color: #000;
        }
        /* Controles táctiles elevados un poco más arriba para que no queden tapados */
        #touch-controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            padding: 8px 15px 25px 15px;
            background: rgba(10, 10, 10, 0.95);
            box-sizing: border-box;
            z-index: 10;
        }
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 55px);
            grid-template-rows: repeat(3, 55px);
            gap: 4px;
        }
        .t-btn {
            background: #222;
            color: #fff;
            border: 2px solid #666;
            font-size: 22px;
            font-weight: bold;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        .t-btn:active {
            background: #555;
        }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }
        
        .action-pad {
            display: flex;
            align-items: center;
        }
        .action-btn {
            width: 75px;
            height: 75px;
            background: #8b0000;
            border-radius: 50%;
            border: 3px solid #ff4500;
            color: white;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            user-select: none;
        }
        .action-btn:active {
            background: #ff4500;
        }
    </style>
</head>
<body>

    <div id="hud">VIDAS: 3</div>
    
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div id="touch-controls">
        <div class="dpad">
            <div class="t-btn" id="btn-up">▲</div>
            <div class="t-btn" id="btn-left">◀</div>
            <div class="t-btn" id="btn-right">▶</div>
            <div class="t-btn" id="btn-down">▼</div>
        </div>
        <div class="action-pad">
            <div class="action-btn" id="btn-bomb">TRAMPA</div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
